<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101317">
    <title>DriveSmooth</title>
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/app.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <span class="brand">DriveSmooth</span>
        <p id="status-message" role="status">Ready to calibrate</p>
        <span id="input-mode" class="mode-badge">Motion</span>
        <a class="settings-link" href="./settings.html" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/><path d="M19.4 13.75a7.9 7.9 0 0 0 .05-1.75 7.9 7.9 0 0 0-.05-1.75l2.06-1.6-2-3.46-2.43.98a8.7 8.7 0 0 0-3.03-1.75L13.63 2h-4l-.37 2.42A8.7 8.7 0 0 0 6.23 6.17L3.8 5.2l-2 3.46 2.06 1.6A7.9 7.9 0 0 0 3.8 12c0 .6.02 1.18.06 1.75l-2.06 1.6 2 3.46 2.43-.98a8.7 8.7 0 0 0 3.03 1.75L9.63 22h4l.37-2.42a8.7 8.7 0 0 0 3.03-1.75l2.43.98 2-3.46-2.06-1.6Z"/></svg>
        </a>
      </header>

      <section class="controls" aria-label="Drive controls">
        <button id="calibrate-button" class="secondary-button" type="button">Calibrate</button>
        <button id="record-button" class="primary-button" type="button">Start drive</button>
      </section>

      <section class="charts-section" aria-label="Force charts">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Force history</p>
            <h1 id="chart-title">Live forces</h1>
          </div>
          <button id="live-view-button" class="text-button" type="button" hidden>Live view</button>
        </div>
        <article class="chart-card">
          <div class="chart-label"><span>X lateral</span><span id="x-chart-range">-1g to +1g</span></div>
          <canvas id="x-chart" aria-label="X lateral force chart"></canvas>
        </article>
        <article class="chart-card">
          <div class="chart-label"><span>Y longitudinal</span><span id="y-chart-range">-1g to +1g</span></div>
          <canvas id="y-chart" aria-label="Y longitudinal force chart"></canvas>
        </article>
      </section>

      <section class="events-section" aria-labelledby="events-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Session memory</p>
            <h2 id="events-title">Drive events</h2>
          </div>
          <span id="event-count" class="event-count">0 saved</span>
        </div>
        <div id="event-log" class="event-log">
          <p class="empty-state">Start a drive to detect acceleration, braking, and cornering events.</p>
        </div>
      </section>
    </main>
  </body>
</html>
